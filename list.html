<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!-- Ordered List -->
    <ol type="1">
        <li>APPLE
            <ul>
                <li>RED Apple</li>
                <li>GREEN Apple</li>
            </ul>
        </li>
        <li>ORANGE</li>
        <li>BANANA</li>
    </ol>

    <!-- Unordered List -->
    <ul style="list-style-type: square;">
        <li>Nepal
            <ul>
                <li>kathmandu</li>
                <li>Pokhara</li>
                <li>Udayapur</li>
            </ul>
        </li>
        <li>India </li>
        <li>Italy</li>
    </ul>


</body>
</html>
