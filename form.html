<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>|| Input || </title>
    <style>
        body{
            position: relative;
            background-color: aqua;


        }
    </style>
</head>
<body>
    <center>
    <!-- In this form we will learn abou input types. -->
    <form>
        <div>
            <!-- Text type -->
      <label for="Name"> Name: </label>
      <input type="text" name="name" id="name" placeholder="Ennter Your Name"  >
      
        </div>
        <div>
            <!-- Email type -->
            <label for="email"> Email:</label>
            <input type="email" name="email" id="email" placeholder="@example.com">
        </div>
        <div>
            <!-- Tel type -->
            <label for="contact"> Contact:</label>
            <input type="tel" name="contact" id="contact" placeholder="XXX-XXXX-XXXX">
        </div>
        <div>
            <!-- Password type -->
             <label for="password"> Password: </label>
             <input type="password" name="password" id="password" placeholder="Enter Your Passowrd">

        </div>
        <div>
            <!-- Date type -->
            <label for="date"> Dat:</label>
            <input type="date" name="date" id="date" placeholder="Enter Date">

        </div> 
        <div>
            <label for="time"> Time:</label>
            <input type="time" name="date" id="time" placeholder="Enter Time">

        </div>
        <div>
            <label for="color"> Color:</label>
            <input type="color" name="color" id="time" placeholder="Choose color">

        </div>
        <div>
            <label for="male"> Gender:</label>
            <label for="gender"> Male</label>
            <input type="radio" name="gender" id="Male">

            <label for="gender"> Famale</label>
            <input type="radio" name="gender" id="female" >

        </div>
        <div>
            <label for="range"> Range:</label>
            <input type="range" name="range" id="range" >
        </div>
        <div>
            <label for="hobbies"> Hobby:</label>

            <input type="checkbox" name="hobbies" id="travel" >
           <label for="travel"> Travel</label>
        
            <input type="checkbox" name="hobbies" id="Rading"> 
            <label for="Reading"> Reading</label>
            <input type="checkbox" name="hobbies" id="Dancing">
            <label for="Dance"> Dance </label>
        </div>
        <div>
            <label for="file"> File</label>
            <input type="file" name="file" id="file" accept=".jpg .png " multiple>
        </div>

    









































    </form>
</center>
</body>
</html>
